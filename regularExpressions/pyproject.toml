[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bibtex-ris"
version = "0.1.0"
description = "BibTeX to RIS converter CLI"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
bibtex-ris = "bibtex_ris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]